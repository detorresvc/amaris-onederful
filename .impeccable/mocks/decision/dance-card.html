<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--cream:#fbf6ec;--blue:#2f5fb3;--navy:#1f3b73;--gold:#c9973f;--gold-deep:#8a6220;--gold-text:#b07f2c;--sky:#a9c7ee;--mist:#e6eef9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden}
body{background:radial-gradient(120% 70% at 50% 0%,#3b6cc0 0%,var(--navy) 70%);font-family:"EB Garamond",serif;color:var(--navy);position:relative}
.cord{position:absolute;left:50%;top:0;width:2px;height:46px;background:var(--gold);transform:translateX(-50%)}
.tassel{position:absolute;left:50%;top:40px;width:16px;height:16px;border-radius:50%;background:var(--gold);transform:translateX(-50%);box-shadow:0 0 0 3px rgba(201,151,63,.35)}
.card{position:absolute;left:18px;right:18px;top:58px;bottom:22px;background:var(--cream);border-radius:14px;padding:24px 22px;box-shadow:0 24px 50px rgba(0,0,0,.35)}
.card:before{content:"";position:absolute;inset:8px;border:2px solid var(--gold);border-radius:9px;pointer-events:none}
.card:after{content:"";position:absolute;inset:13px;border:1px solid rgba(201,151,63,.5);border-radius:6px;pointer-events:none}
.hole{position:absolute;left:50%;top:-4px;width:14px;height:14px;border-radius:50%;background:var(--navy);transform:translateX(-50%);border:2px solid var(--gold)}
.top{display:flex;gap:14px;align-items:center;margin-top:8px}
.medal{flex:none;width:118px;height:146px;border-radius:50%;overflow:hidden;border:3px solid var(--gold);box-shadow:0 0 0 4px var(--cream),0 0 0 5px rgba(201,151,63,.6)}
.medal img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.word .k{font-family:Cinzel,serif;font-size:12px;letter-spacing:.18em;color:var(--blue)}
.word .one{font-family:Cinzel,serif;font-weight:700;font-size:56px;line-height:.9;color:var(--gold-text)}
.word .derful{font-family:"Great Vibes",cursive;font-size:40px;line-height:.7;color:var(--blue)}
.honour{text-align:center;margin-top:16px}
.honour .s{font-family:"Great Vibes",cursive;font-size:46px;color:var(--blue);line-height:1}
.honour .f{font-size:17px;color:var(--gold-deep)}
.prog{margin-top:12px;text-align:center;font-family:Cinzel,serif;font-size:13px;letter-spacing:.22em;color:var(--navy)}
.prog:before,.prog:after{content:"✦";color:var(--gold);margin:0 10px;font-size:11px}
ol{list-style:none;margin-top:10px}
li{display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px dotted rgba(31,59,115,.35);font-size:17px}
li b{font-family:Cinzel,serif;font-weight:700;font-size:15px;color:var(--blue)}
.count{margin-top:12px;text-align:center;font-style:italic;font-size:16px}
.count b{font-family:Cinzel,serif;font-style:normal;color:var(--gold-deep);font-size:20px}
.cta{position:absolute;left:30px;right:30px;bottom:28px}
.rsvp{display:block;text-align:center;background:var(--navy);color:var(--cream);font-family:Cinzel,serif;font-weight:700;letter-spacing:.14em;font-size:15px;padding:15px;border-radius:8px;text-decoration:none;border:1px solid var(--gold)}
.mini{display:flex;justify-content:center;gap:18px;margin-top:10px;font-size:15px;color:var(--blue)}
.mini span{border-bottom:1px solid var(--gold)}
</style></head><body>
<div class="cord"></div><div class="tassel"></div>
<section class="card">
  <span class="hole"></span>
  <div class="top">
    <div class="medal"><img src="../../../public/photos/amaris-blue-gown.jpg" alt="Amaris in a blue gown, clapping and laughing"></div>
    <div class="word"><p class="k">A LITTLE PRINCESS IS TURNING</p><p class="one">ONE</p><p class="derful">derful</p></div>
  </div>
  <div class="honour"><p class="s">Amaris</p><p class="f">Keziah D. Benedicto’s 1st Birthday</p></div>
  <p class="prog">PROGRAMME</p>
  <ol>
    <li><b>SUNDAY</b><span>November 22, 2026</span></li>
    <li><b>6:00 PM</b><span>Guests arrive at the ball</span></li>
    <li><b>VENUE</b><span>Jollibee Potrero, MacArthur Hwy, Malabon</span></li>
  </ol>
  <p class="count">The ball begins in <b>17 days</b></p>
  <div class="cta"><a class="rsvp" href="#">RESERVE YOUR PLACE</a><div class="mini"><span>Directions</span><span>Add to calendar</span></div></div>
</section>
</body></html>
