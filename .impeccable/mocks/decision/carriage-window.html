<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--cream:#fbf6ec;--blue:#2f5fb3;--navy:#1f3b73;--gold:#c9973f;--gold-deep:#8a6220;--gold-text:#b07f2c;--sky:#a9c7ee;--mist:#e6eef9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden}
body{background:var(--cream);font-family:"EB Garamond",serif;color:var(--navy);position:relative}
.body{position:absolute;inset:0;background:radial-gradient(130% 60% at 50% 30%,#fffdf7 0%,var(--cream) 55%,#f1e6cf 100%)}
.curtain{position:absolute;top:0;width:96px;height:470px;background:repeating-linear-gradient(90deg,#2f5fb3 0 10px,#3f72c6 10px 18px,#24509d 18px 24px);z-index:3}
.curtain.l{left:0;clip-path:polygon(0 0,100% 0,62% 46%,38% 72%,0 100%);border-radius:0 0 30px 0}
.curtain.r{right:0;clip-path:polygon(0 0,100% 0,100% 100%,62% 72%,38% 46%)}
.tie{position:absolute;top:300px;width:22px;height:22px;border-radius:50%;background:var(--gold);z-index:4;box-shadow:0 0 0 3px rgba(201,151,63,.35)}
.tie.l{left:30px}.tie.r{right:30px}
.valance{position:absolute;top:0;left:0;right:0;height:34px;background:var(--navy);z-index:5;border-bottom:3px solid var(--gold);clip-path:polygon(0 0,100% 0,100% 70%,90% 100%,80% 70%,70% 100%,60% 70%,50% 100%,40% 70%,30% 100%,20% 70%,10% 100%,0 70%)}
.window{position:absolute;left:50%;top:58px;transform:translateX(-50%);width:228px;height:300px;border-radius:50%;padding:12px;background:linear-gradient(150deg,#f2dca0,#b8862f 45%,#e9c97f 70%,#a87a2a);z-index:2;box-shadow:0 14px 30px rgba(31,59,115,.25)}
.window img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 20%;display:block;border:2px solid #fff6dc}
.word{position:absolute;top:372px;left:0;right:0;text-align:center;z-index:6}
.word .one{font-family:Cinzel,serif;font-weight:700;font-size:56px;line-height:.9;color:var(--gold-text);display:inline}
.word .derful{font-family:"Great Vibes",cursive;font-size:44px;color:var(--blue);display:inline;margin-left:4px}
.door{position:absolute;left:20px;right:20px;top:446px;bottom:20px;background:#fffdf7;border:1.5px solid var(--gold);border-radius:22px 22px 12px 12px;padding:18px 20px;text-align:center;box-shadow:0 14px 30px rgba(31,59,115,.15)}
.door:before{content:"";position:absolute;inset:6px;border:1px solid rgba(201,151,63,.45);border-radius:17px 17px 8px 8px;pointer-events:none}
.name{font-family:"Great Vibes",cursive;font-size:42px;line-height:1;color:var(--blue)}
.full{font-size:16px;color:var(--gold-deep)}
.facts{display:grid;grid-template-columns:1fr 1px 1fr;gap:10px;margin:12px 0 6px;align-items:center}
.facts i{background:var(--gold);height:100%;opacity:.6}
.big{font-family:Cinzel,serif;font-weight:700;font-size:19px}
.sm{font-size:15px}
.where{font-size:16px}
.rsvp{display:block;margin-top:12px;background:var(--blue);color:#fff;font-family:Cinzel,serif;font-weight:700;letter-spacing:.14em;font-size:15px;padding:14px;border-radius:999px;text-decoration:none}
.mini{display:flex;justify-content:center;gap:18px;margin-top:10px;font-size:15px;color:var(--blue)}
.mini span{border-bottom:1px solid var(--gold)}
</style></head><body>
<div class="body"></div>
<div class="valance"></div>
<div class="curtain l"></div><div class="curtain r"></div>
<span class="tie l"></span><span class="tie r"></span>
<div class="window"><img src="../../../public/photos/amaris-blue-gown.jpg" alt="Amaris in a blue gown, clapping and laughing"></div>
<p class="word"><span class="one">ONE</span><span class="derful">derful</span></p>
<section class="door">
  <p class="name">Amaris</p>
  <p class="full">Keziah D. Benedicto’s 1st Birthday</p>
  <div class="facts">
    <div><p class="sm">Sunday</p><p class="big">NOV 22, 2026</p></div><i></i>
    <div><p class="sm">The ball begins</p><p class="big">6:00 PM</p></div>
  </div>
  <p class="where">Jollibee Potrero, MacArthur Hwy, Malabon</p>
  <a class="rsvp" href="#">RSVP</a>
  <div class="mini"><span>Directions</span><span>Add to calendar</span></div>
</section>
</body></html>
